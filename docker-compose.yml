version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: portfolio
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped

  server:
    build:
      context: ./server
    env_file:
      - .env
    depends_on:
      - db
    ports:
      - "5500:5500"
    restart: unless-stopped

  client:
    build:
      context: ./client
    depends_on:
      - server
    ports:
      - "80:80"
    restart: unless-stopped

  # One-off initializer to run prisma migrations and seed the database.
  init:
    build:
      context: ./server
    env_file:
      - .env
    command: sh -c "npx prisma migrate deploy --preview-feature || npx prisma db push && node prisma/seed.js"
    depends_on:
      - db
    restart: "no"

volumes:
  db_data:
